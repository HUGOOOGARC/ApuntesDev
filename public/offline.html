<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modo Sin Conexión | ApuntesDev</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --card-bg: #12141f;
      --accent: #4ade80;
      --accent-glow: rgba(74, 222, 128, 0.35);
      --text: #e8e8f0;
      --text-muted: #8888a0;
      --border: #2a2a38;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-image: radial-gradient(circle at 50% 20%, rgba(74, 222, 128, 0.08) 0%, transparent 60%);
    }
    .offline-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,0.6);
      position: relative;
      overflow: hidden;
    }
    .offline-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }
    .offline-icon {
      font-size: 3.5rem;
      line-height: 1;
      margin-bottom: 1.5rem;
      display: inline-block;
      filter: drop-shadow(0 0 16px rgba(74, 222, 128, 0.3));
    }
    .offline-pill {
      display: inline-block;
      background: rgba(74, 222, 128, 0.1);
      border: 1px solid rgba(74, 222, 128, 0.3);
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.35rem 1rem;
      border-radius: 100px;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 0.85rem;
      color: #fff;
    }
    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .offline-actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .btn-retry {
      background: var(--accent);
      color: #060809;
      border: none;
      border-radius: 12px;
      padding: 0.85rem 1.5rem;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px var(--accent-glow);
    }
    .btn-retry:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--accent-glow);
    }
    .btn-link {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      border-radius: 12px;
      padding: 0.85rem 1.5rem;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .btn-link:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="offline-box">
    <div class="offline-icon">📡</div>
    <div>
      <span class="offline-pill">MODO SIN CONEXIÓN • PWA</span>
    </div>
    <h1>Estás en Modo Offline</h1>
    <p>
      No tienes conexión a internet en este momento, pero puedes seguir utilizando la <strong>Calculadora de Subnetting</strong>, el <strong>Generador chmod</strong> y consultar los apuntes que ya visitaste previamente.
    </p>
    <div class="offline-actions">
      <button class="btn-retry" onclick="window.location.reload()">🔄 Reintentar Conexión</button>
      <a href="/herramientas" class="btn-link">🛠️ Ir a Herramientas del Técnico</a>
      <a href="/" class="btn-link">🏠 Ir al Inicio</a>
    </div>
  </div>
</body>
</html>
